# Optional split deploy: web-only service built from apps/web/Dockerfile.
# Railway → Service → Settings → Config file path: deploy/railway/web.railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "i18n/**",
  "pnpm-lock.yaml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
