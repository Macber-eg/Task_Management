# Serves the built SPA. /api/ and /.well-known/ are handled by the snippet
# 40-kaneo-api-proxy.sh writes at startup: proxied to KANEO_API_UPSTREAM in
# the same-origin layout, or 404 when the API is hosted elsewhere.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Large auth cookies and OAuth redirects.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    # The API's own JSON body limit; uploads are capped lower by the API.
    client_max_body_size 25m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/kaneo/api.conf;

    # Builds ship without source maps; refuse them anyway.
    location ~* \.map$ {
        return 404;
    }

    # Vite's content-hashed bundles never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Always revalidate the entry document so a deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routes fall back to the SPA entry.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
