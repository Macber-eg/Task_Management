# Keeps this project out of the parent monorepo workspace: it installs with
# its own lockfile and node_modules.
packages:
  - "."

# Security pins carried over from the root workspace (only the ones that can
# appear in this dependency tree).
overrides:
  "@isaacs/brace-expansion": 5.0.1
  "@babel/core": ">=7.29.6 <8"
  brace-expansion: ">=5.0.9"
  esbuild: 0.28.1
  js-yaml: ">=4.3.2 <5"
  lodash: 4.18.1
  markdown-it: 14.1.1
  minimatch: 10.2.3
  "nanoid@3": ">=3.3.18 <4"
  picomatch: ">=4.0.4"
  postcss: ">=8.5.23"
  postcss-selector-parser: ">=7.1.3"
  rollup: 4.59.0
  seroval: ">=1.5.3"
  undici: ">=7.29.0 <8"
  ws: ">=8.20.1"
  yaml: ">=2.8.3"

onlyBuiltDependencies:
  - esbuild
